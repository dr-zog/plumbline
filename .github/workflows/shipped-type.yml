# Shipped-content changes must release (#36).
#
# A skill's `.md` IS the plugin's behaviour, so any change under plugins/plumbline/**
# ships to consumers and must cut a release — i.e. the PR title must be a *releasing*
# Conventional Commit (fix / feat / perf / revert, or a breaking `!`). A non-releasing
# type (docs / chore / ci / refactor / test / style / build) on a shipped change would
# land on `main` but never reach `dist` (see #35). This check fails that combination.
name: shipped-type

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  shipped-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shipped changes must be fix/feat
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- plugins/plumbline/ | grep -q .; then
            echo "No plugins/plumbline/ changes — nothing to enforce."
            exit 0
          fi
          echo "This PR changes shipped plugin content:"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- plugins/plumbline/ | sed 's/^/  /'
          # Parse the Conventional-Commit type (+ breaking marker) from the PR title.
          marked=$(printf '%s' "$TITLE" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?(!?):.*/\1\3/p')
          type=${marked%!}
          echo "PR title type: '${marked:-<unparseable>}'"
          case "$marked" in
            *!) echo "Breaking change — releases. OK."; exit 0 ;;
          esac
          case "$type" in
            fix | feat | perf | revert) echo "Releasing type ('$type') — OK."; exit 0 ;;
          esac
          echo "::error::This PR changes shipped plugin content (plugins/plumbline/**) but its title type '${type:-?}' does not cut a release. A shipped skill IS the plugin's behaviour — title it fix: or feat: (or a breaking change) so consumers actually receive it. See docs/processes/raising-a-pr.md."
          exit 1
